name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Typecheck
        run: npm run typecheck
      - name: Enforce hard limits (no secrets, no hardware identifiers)
        run: npm run check:limits
      - name: Check collected sample dataset is up to date
        run: npm run collect:check
      - name: Test with coverage thresholds
        run: npm test
      - name: Build
        run: npm run build
      - name: Check static build output
        run: test -f dist/index.html || { echo "dist/index.html is missing"; exit 1; }
      - name: Bundle size budget
        run: npm run check:bundle
      - name: Check documentation links
        run: npm run check:links
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: End-to-end smoke tests
        run: npm run test:e2e
        env:
          CI: true
